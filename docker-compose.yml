services:

  redis:
    image: redis:latest
    restart: unless-stopped

  scaphandre:
    image: docker.io/hubblo/scaphandre
    command: prometheus -p 8080 -a 0.0.0.0
    privileged: true  # Required for hardware access
    security_opt:
      - apparmor=unconfined
    network_mode: "host"
    volumes:
      - /sys/class/powercap:/sys/class/powercap  # RAPL power metrics
      - /proc:/proc  # Process information
    restart: unless-stopped

  proxy:
    build: .
    ports:
      - 8676:8676
    depends_on:
      - metadata-service
      - backend
    environment:
      - DATACLAY_PROXY_MDS_HOST=metadata-service
      - DATACLAY_KV_HOST=redis
    command: python -m dataclay.proxy
    restart: unless-stopped

  metadata-service:
    build: .
    depends_on:
      - redis
    environment:
      - DATACLAY_KV_HOST=redis
    command: python -m dataclay.metadata
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      - redis
    environment:
      - PYTHONPATH=/usr/oasis
      - DATACLAY_KV_HOST=redis
      - DATACLAY_MEMORY_CHECK_INTERVAL=600
    volumes:
      - ../ICOS-AI-Coordination-API/dataset:/usr/oasis/dataset:rw
      - ../ICOS-AI-Coordination-API/oasis/analytics:/usr/oasis/analytics:ro
      - ../ICOS-AI-Coordination-API/oasis/processing:/usr/oasis/processing:ro
      - ../ICOS-AI-Coordination-API/oasis/models:/usr/oasis/models:ro
      - ../ICOS-AI-Coordination-API/oasis/tai:/usr/oasis/tai:ro
      - ../ICOS-AI-Coordination-API/oasis/organizer_fl.py:/usr/oasis/organizer_fl.py:ro
      - ../ICOS-AI-Coordination-API/oasis/fl_runner.py:/usr/oasis/fl_runner.py
    command: sh -c "export PYTHONPATH=/usr/oasis && python -m dataclay.backend"
    #command: python -m dataclay.backend
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml
    command: --config=/etc/otel-config.yaml
    network_mode: host
    depends_on:
      - scaphandre
    restart: unless-stopped

  bridge-config:
    build:
      context: .
      dockerfile: bridge-config.Dockerfile
    depends_on:
      - proxy
      - metadata-service
      - backend
      - redis
    environment:
      - DATACLAY_PROXY_HOST=proxy
      - DATACLAY_PROXY_PORT=8676
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: bridge.Dockerfile
    network_mode: host
    depends_on:
      - bridge-config
      - otel-collector
      - scaphandre
    environment:
      - DATACLAY_PROXY_HOST=localhost
      - DATACLAY_PROXY_PORT=8676
    restart: unless-stopped

# FL Runner Container - Simplified configuration for ICOS project
  fl-runner:
    build:
      context: .
      dockerfile: Dockerfile.fl-runner
      args:
        ICOS_FL_VERSION: master

    container_name: icos-fl-runner

    network_mode: host

    environment:
      # DataClay connection settings
      - DC_PROXY_HOST=localhost
      - DC_PROXY_PORT=8676
      - DC_PROXY_ENABLED=True
      - DC_DATASET=testdata

      # FL configuration
      - MODEL_METRIC=cpu_usage
      - ICOSFL_PATH=/app/icos-fl

    depends_on:
      - proxy

    restart: unless-stopped
